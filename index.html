<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Api</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <input type="text" id="search" placeholder="Search Pokemon" />
    <div id="pokemonGrid" class="grid"></div>

    <dialog id="pokemonDialog" class="dialog">
        <div class="dialog-content">
            <div class="dialog-left">
                <div class="carousel">
                    <button class="prev">&#10094;</button>
                    <img id="dialogImage" />
                    <button class="next">&#10095;</button>
                </div>
            </div>

            <div class="dialog-info">
                <h2 id="dialogName"></h2>
                <p><strong>Height:</strong> <span id="dialogHeight"></span></p>
                <p><strong>Weight:</strong> <span id="dialogWeight"></span></p>
                <p><strong>Types:</strong> <span id="dialogTypes"></span></p>
            </div>
        </div>
    </dialog>

    <script src="./script.js"></script>
</body>

</html>
